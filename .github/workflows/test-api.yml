name: Test Telegram API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Telethon
        run: pip install telethon

      - name: Test API and Channel
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python -c "
          import asyncio
          import os
          from telethon import TelegramClient
          
          async def test():
              api_id = int(os.environ['API_ID'])
              api_hash = os.environ['API_HASH']
              channel = os.environ['CHANNEL_ID']
              
              print('🔍 Подключение к Telegram...')
              # Создаём клиент без авторизации
              client = TelegramClient('test_session', api_id, api_hash)
              await client.connect()
              print('✅ Подключение установлено!')
              
              # Пробуем получить канал
              print(f'🔍 Поиск канала: {channel}')
              try:
                  entity = await client.get_entity(channel)
                  print(f'✅ Канал найден: {entity.title}')
                  print(f'📊 ID канала: {entity.id}')
              except Exception as e:
                  print(f'❌ Ошибка: {e}')
                  return
              
              # Пробуем получить последние посты
              print('🔍 Получение последних постов...')
              messages = []
              async for msg in client.iter_messages(entity, limit=2):
                  messages.append(msg)
              
              if messages:
                  print(f'✅ Получено {len(messages)} постов')
                  for msg in messages:
                      print(f'   📝 ID: {msg.id}, Дата: {msg.date}')
              else:
                  print('❌ Нет постов')
              
              await client.disconnect()
          
          asyncio.run(test())
          "

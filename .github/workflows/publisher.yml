name: Publisher

on:
  # Ручной запуск
  workflow_dispatch:
  # Запуск по расписанию (каждые 6 часов)
  schedule:
    - cron: '0 */6 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download posts
      uses: actions/download-artifact@v4
      with:
        name: posts
        path: posts/
      continue-on-error: true
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install selenium webdriver-manager
    
    - name: Run publisher
      env:
        USER_HASH: ${{ secrets.USER_HASH }}
        UUK: ${{ secrets.UUK }}
      run: |
        python publisher.py
    
    - name: Upload published posts
      uses: actions/upload-artifact@v4
      with:
        name: published-posts
        path: published/
        retention-days: 30

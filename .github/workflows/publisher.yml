name: Publisher

on:
  # Запускается после успешного парсинга
  workflow_run:
    workflows: ["Telegram Parser"]
    types:
      - completed
  # Ручной запуск
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install selenium webdriver-manager
    
    - name: Run publisher
      env:
        USER_HASH: ${{ secrets.USER_HASH }}
        UUK: ${{ secrets.UUK }}
      run: |
        python publisher.py
    
    - name: Commit and push published posts
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/posts/ published/ publisher_state.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update published posts $(date +'%Y-%m-%d')"
        git push

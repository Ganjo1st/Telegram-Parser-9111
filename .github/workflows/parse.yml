name: Parse and Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # Каждые 30 минут

jobs:
  parse:
    runs-on: ubuntu-24.04
    outputs:
      has_posts: ${{ steps.check.outputs.has_posts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TEST_MODE: ${{ vars.TEST_MODE || 'false' }}
        run: python parser.py

      - name: Commit and push new posts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/posts/ || true
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "📭 Новых постов нет"
            echo "has_posts=false" >> $GITHUB_OUTPUT
          else
            git commit -m "📝 Add parsed posts $(date +'%Y-%m-%d %H:%M:%S')" || true
            git pull --rebase origin main || true
            git push origin main || true
            echo "✅ Новые посты добавлены"
            echo "has_posts=true" >> $GITHUB_OUTPUT
          fi
        id: check

  publish:
    needs: parse
    if: needs.parse.outputs.has_posts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Check if there are new posts
        id: check_posts
        run: |
          if [ -n "$(ls -A data/posts/ 2>/dev/null)" ]; then
            echo "has_posts=true" >> $GITHUB_OUTPUT
            echo "📦 Найдены посты для публикации"
          else
            echo "has_posts=false" >> $GITHUB_OUTPUT
            echo "📭 Нет постов для публикации"
          fi

      - name: Run publisher
        if: steps.check_posts.outputs.has_posts == 'true'
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python publisher.py

      - name: Commit and push published state
        if: steps.check_posts.outputs.has_posts == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add publisher_state.json || true
          git add published/ || true
          git add data/posts/ || true
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "📤 Update published state $(date +'%Y-%m-%d %H:%M:%S')" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
          if-no-files-found: ignore

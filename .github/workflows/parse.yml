name: Parse Telegram Channel

on:
  workflow_dispatch:  # Ручной запуск
  schedule:
    - cron: '*/30 * * * *'  # Каждые 30 минут
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/parse.yml'  # Запуск при изменении workflow

jobs:
  parse:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TEST_MODE: ${{ vars.TEST_MODE || 'false' }}
        run: python parser.py

      - name: Commit and push new posts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/posts/ || true
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "📭 Новых постов нет"
          else
            git commit -m "📝 Add parsed posts $(date +'%Y-%m-%d %H:%M:%S')" || true
            git pull --rebase origin main || true
            git push origin main || true
            echo "✅ Новые посты добавлены"
          fi

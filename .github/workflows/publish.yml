name: Publish to 9111.ru

on:
  workflow_dispatch:  # Ручной запуск
  schedule:
    - cron: '*/30 * * * *'  # Каждые 30 минут
  push:
    branches: [ main ]
    paths:
      - 'data/posts/**'  # Запускается только если есть новые посты

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Check if there are new posts
        id: check_posts
        run: |
          if [ -n "$(ls -A data/posts/ 2>/dev/null)" ]; then
            echo "has_posts=true" >> $GITHUB_OUTPUT
            echo "📦 Найдены посты для публикации"
          else
            echo "has_posts=false" >> $GITHUB_OUTPUT
            echo "📭 Нет постов для публикации"
          fi

      - name: Run publisher
        if: steps.check_posts.outputs.has_posts == 'true'
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python publisher.py

      - name: Commit and push published state
        if: steps.check_posts.outputs.has_posts == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add publisher_state.json || true
          git add published/ || true
          git add data/posts/ || true
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "📤 Update published state $(date +'%Y-%m-%d %H:%M:%S')" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
          if-no-files-found: ignore

name: Publish to 9111.ru

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install zapret
        run: |
          # Устанавливаем зависимости
          sudo apt-get install -y curl wget net-tools iproute2 iptables
          
          # Скачиваем zapret
          cd /tmp
          git clone https://github.com/bol-van/zapret.git
          cd zapret
          
          # Используем install.sh вместо make install
          sudo ./install.sh
          
          # Проверяем установку
          /opt/zapret/zapret --version || echo "zapret installed"
          
          # Копируем конфиг
          sudo cp config.default /etc/zapret/config
          
          # Настраиваем для обхода блокировок
          echo "ENABLED=1" | sudo tee -a /etc/zapret/config
          echo "MODE=hostip" | sudo tee -a /etc/zapret/config
          echo "DPI_MODE=whitelist" | sudo tee -a /etc/zapret/config
          echo "WHITELIST_RULES=hostlist" | sudo tee -a /etc/zapret/config
          
          # Запускаем zapret
          sudo /opt/zapret/zapret start

      - name: Run publisher
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python publisher.py

      - name: Commit and push published state
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add publisher_state.json || true
          git add published/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "📤 Update published state $(date +'%Y-%m-%d %H:%M:%S')" || true
          git push || true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
          if-no-files-found: ignore

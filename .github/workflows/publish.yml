name: Publish to 9111.ru

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Важно для git pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Show posts folder
        run: |
          echo "=== Содержимое data/posts ==="
          ls -la data/posts/ || echo "Папка пуста или не существует"
          echo "=== Количество папок ==="
          find data/posts -type d | wc -l || echo "0"

      - name: Run publisher
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python publisher.py

      - name: Commit and push published state
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем только файлы состояния
          git add publisher_state.json || true
          git add published/ || true
          
          # Проверяем изменения
          if git diff --quiet && git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "📤 Update published state $(date +'%Y-%m-%d %H:%M:%S')" || true
            # Пробуем pull перед push
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
          if-no-files-found: ignore

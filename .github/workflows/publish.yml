name: Daily Publisher

on:
  schedule:
    - cron: '0 10 * * *'  # Запуск каждый день в 10:00 UTC
  workflow_dispatch:       # Возможность ручного запуска

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Нужно для сохранения состояния (last_id и т.д.)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Checkout Proctor repository (for proxies)
        uses: actions/checkout@v4
        with:
          repository: Ganjo1st/Proctor
          path: proctor_temp
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Publisher with Selenium
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python publisher.py

      - name: Commit and push changes (published state)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add published/ publisher_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update published state $(date +'%Y-%m-%d')" || true
          git push

name: 02 - Publish to 9111.ru

on:
  schedule:
    - cron: '0 10 * * *'  # Каждый день в 10:00 UTC
  workflow_dispatch:      # Ручной запуск

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          # Получаем последний коммит с постами
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug - List files in data/posts
        run: |
          echo "=== Содержимое data/posts ==="
          ls -la data/posts/ || echo "Папка пуста или не существует"
          echo "=== Количество папок ==="
          find data/posts -type d | wc -l || echo "0"

      - name: Run Publisher (Selenium)
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python publisher.py

      - name: Commit and push changes (published state)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts/ published/ publisher_state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update published state $(date +'%Y-%m-%d')" || true
          git push

name: Telegram Parser & Publisher

on:
  schedule:
    - cron: '*/30 * * * *'  # Каждые 30 минут для парсинга
  workflow_dispatch:  # Ручной запуск

jobs:
  parse-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      
      - name: Checkout Proctor repository (for proxies)
        uses: actions/checkout@v4
        with:
          repository: Ganjo1st/Proctor
          path: proctor_temp
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      # Шаг 1: Парсинг Telegram
      - name: Parse Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_LOGIN: ${{ secrets.SITE_LOGIN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python parser.py
      
      # Шаг 2: Публикация на сайте (только если есть новые посты)
      - name: Publish to 9111.ru
        env:
          SITE_EMAIL: ${{ secrets.SITE_LOGIN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python publisher.py
      
      # Шаг 3: Сохранение изменений
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts/ data/last_id.txt sessions/ published/ publisher_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update $(date +'%Y-%m-%d %H:%M:%S')" || true
          git push
